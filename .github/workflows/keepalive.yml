name: Supabase keepalive

# Evita que el plan gratuito de Supabase pause los proyectos por 7 días sin actividad.
on:
  schedule:
    - cron: '17 12 */3 * *' # cada 3 días, 09:17 hora Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [STAGING, PROD]
    steps:
      - name: Ping ${{ matrix.target }}
        env:
          SUPABASE_URL: ${{ secrets[format('{0}_SUPABASE_URL', matrix.target)] }}
          SUPABASE_ANON_KEY: ${{ secrets[format('{0}_SUPABASE_ANON_KEY', matrix.target)] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secrets de ${{ matrix.target }} no configurados; se omite."
            exit 0
          fi
          response=$(curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Respuesta: $response"
          test "$response" = '"ok"'
